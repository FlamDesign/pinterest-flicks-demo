<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flicks on Pinterest</title>
<meta name="description" content="Clickable concept: Flicks inside Pinterest's home feed, search, Pin close-up, shopping, collection, idea, max-width video, quiz and visual search ad formats.">
<style>
:root{
  --red:#e60023;--red-d:#ad081b;--ink:#111;--ink2:#5f5f5f;--line:#e9e9e9;--chip:#efefef;--chip-h:#e2e2e2;--bg:#fff;
  --r:16px;--ease:cubic-bezier(.2,.7,.2,1);
  --rail:72px;--top:80px;--gap:16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(230,0,35,.55)}100%{box-shadow:0 0 0 14px rgba(230,0,35,0)}}

/* ---------- shell ---------- */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;background:#fff;z-index:40}
.logo{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin-bottom:10px}
.logo span{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font:700 19px/1 Georgia,"Times New Roman",serif;letter-spacing:-1px}
.rbtn{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#111;transition:background .15s}
.rbtn:hover{background:var(--chip)}
.rbtn.on{background:#111;color:#fff}
.rail .sp{flex:1}
.top{position:fixed;left:var(--rail);right:0;top:0;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 24px;background:#fff;z-index:30}
.sbox{flex:1;position:relative}
.sbox input{width:100%;height:48px;border-radius:16px;border:0;background:var(--chip);padding:0 46px 0 48px;font-size:16px;outline:none;color:#111}
.sbox input:focus{box-shadow:0 0 0 4px rgba(0,132,255,.35);background:#fff}
.sbox .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#767676;pointer-events:none}
.sbox .lensb{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#5f5f5f}
.sbox .lensb:hover{background:#e2e2e2}
.sugg{position:absolute;left:0;right:0;top:56px;background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.18);padding:12px 8px;display:none;z-index:50}
.sugg.on{display:block;animation:fade .15s}
.sugg h6{margin:6px 12px 8px;font-size:13px;font-weight:600;color:#111}
.sugg button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;font-size:15px;text-align:left}
.sugg button:hover,.sugg button.hi{background:var(--chip)}
.sugg button i{font-style:normal;font-size:11px;color:#fff;background:var(--red);border-radius:999px;padding:2px 7px;margin-left:auto}
.av{width:32px;height:32px;border-radius:50%;background:#d9e7d6;color:#235c2a;font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}
.topbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#5f5f5f}
.topbtn:hover{background:var(--chip)}
main{padding:var(--top) 16px 96px calc(var(--rail) + 16px)}
.view{display:none}
.view.on{display:block}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 8px 16px;position:sticky;top:var(--top);background:#fff;z-index:20}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:12px;background:var(--chip);font-weight:600;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:background .15s}
.chip:hover{background:var(--chip-h)}
.chip.on{background:#111;color:#fff}
.chip img{width:28px;height:28px;border-radius:8px;object-fit:cover;margin-left:-8px}

/* ---------- masonry ---------- */
.grid{position:relative;margin:0 auto;transition:height .2s}
.pin{position:absolute;top:0;left:0;animation:fade .45s var(--ease) both;transition:transform .25s var(--ease)}
.pm{position:relative;border-radius:var(--r);overflow:hidden;background:#efefef;cursor:zoom-in}
.pm img.ph{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.pm img.ph.ld{opacity:1}
.pm .ov{position:absolute;inset:0;background:rgba(0,0,0,.28);opacity:0;transition:opacity .15s;pointer-events:none}
.pin:hover .pm .ov{opacity:1}
.pm .save{position:absolute;right:12px;top:12px;height:44px;padding:0 16px;border-radius:24px;background:var(--red);color:#fff;font-weight:700;opacity:0;transition:opacity .15s;z-index:3}
.pin:hover .pm .save{opacity:1}
.pm .lensdot{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;opacity:0;transition:opacity .15s;z-index:3}
.pin:hover .pm .lensdot{opacity:1}
.pcap{padding:8px 6px 4px}
.pcap .t{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcap .by{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:#111}
.pcap .by .a{width:24px;height:24px;font-size:10px}
.pcap .pr{font-size:14px;font-weight:700;margin-top:4px}
.pcap .pr s{font-weight:400;color:#767676;margin-left:6px}
.promo{font-size:12px;color:#111;margin-top:2px}
.promo b{font-weight:600}
.dots3{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.dots3 i{width:6px;height:6px;border-radius:50%;background:#cfcfcf;transition:background .2s,transform .2s}
.dots3 i.on{background:#111;transform:scale(1.2)}
.vname{transition:opacity .15s}

/* ---------- Flick stage ---------- */
.flick{position:relative;overflow:hidden;background:#efefef;width:100%;aspect-ratio:1/1}
.flick.tall{aspect-ratio:9/16}
.flick iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;opacity:0;transition:opacity .6s var(--ease)}
.flick.rdy iframe{opacity:1}
.fstate{position:absolute;inset:0;pointer-events:none;transition:opacity .5s var(--ease);background:linear-gradient(100deg,#ececec 30%,#f7f7f7 50%,#ececec 70%);background-size:300% 100%;animation:shim 1.5s linear infinite}
.fstate.hide{opacity:0}
.flick.dark,.flick.dark .fstate{background-color:#151515}
.flick.dark .fstate{background-image:linear-gradient(100deg,#151515 30%,#262626 50%,#151515 70%)}
.flick.fl-bentley{background:radial-gradient(120% 90% at 50% 45%,#3a3f44 0%,#16181a 60%,#08090a 100%)}
.fstate.err{animation:none;background:#2b1414;color:#ffd9d4;pointer-events:auto;padding:18px;text-align:center;font-size:12px;line-height:1.5;display:grid;place-items:center}
.fstate.err b{display:block;font-size:14px;margin-bottom:6px;color:#fff}
.fwarn{position:absolute;left:8px;bottom:8px;font-size:11px;background:#fff6db;color:#7a5600;border-radius:999px;padding:3px 9px;pointer-events:none;z-index:2}
.flk .pm{cursor:default}
.flk .pm .ov{display:none}
.openpin{position:absolute;left:10px;top:10px;z-index:4;height:30px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.92);font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;opacity:0;transition:opacity .15s;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.pin:hover .openpin{opacity:1}
@media (hover:none){.openpin{opacity:1}}

/* section label inside grid (Top of search / Shop) */
.toplbl{font-size:12px;font-weight:600;color:#111;display:flex;align-items:center;gap:6px;padding:0 6px 6px}
.toplbl i{font-style:normal;background:#111;color:#fff;border-radius:6px;padding:2px 6px;font-size:11px}

/* ---------- format-specific ---------- */
.coll{border-radius:var(--r);overflow:hidden;background:#f6f6f6}
.coll .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:2px}
.coll .tiles button{aspect-ratio:1;background:#fff;position:relative;overflow:hidden;outline:2px solid transparent;outline-offset:-2px;transition:outline-color .2s}
.coll .tiles button img{width:100%;height:100%;object-fit:contain;padding:8%}
.coll .tiles button.on{outline-color:#111}
.coll .tiles button span{position:absolute;left:6px;bottom:5px;font-size:10px;font-weight:600;background:rgba(255,255,255,.9);border-radius:6px;padding:1px 5px}
.maxw .pm{border-radius:var(--r)}
.maxbadge{position:absolute;left:12px;bottom:12px;z-index:3;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:4px 10px;pointer-events:none}
.quiz{border-radius:var(--r);overflow:hidden;background:#1d2a36;color:#fff;aspect-ratio:2/3;position:relative;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end}
.quiz img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.quiz .qin{position:relative;padding:18px}
.quiz .qin small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.quiz .qin h4{margin:6px 0 12px;font-size:20px;line-height:1.2}
.quiz .qin span{display:inline-flex;height:38px;align-items:center;padding:0 16px;border-radius:999px;background:#fff;color:#111;font-weight:700;font-size:14px}

/* ---------- close-up ---------- */
.cu-wrap{max-width:1016px;margin:8px auto 28px;position:relative}
.back{position:fixed;left:calc(var(--rail) + 16px);top:calc(var(--top) + 8px);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#fff;z-index:25;box-shadow:0 0 0 1px var(--line)}
.back:hover{background:var(--chip)}
.cu{display:grid;grid-template-columns:1fr 1fr;border-radius:32px;box-shadow:0 1px 20px rgba(0,0,0,.1);overflow:hidden;background:#fff}
.cu-media{background:#f2f2f2;position:relative;align-self:start}
.cu-media img{width:100%;height:auto}
.cu-media .flick{border-radius:0}
.cu-side{padding:24px 28px 28px;display:flex;flex-direction:column;gap:16px;min-width:0}
.cu-bar{display:flex;align-items:center;gap:8px}
.cu-bar .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.cu-bar .ico:hover{background:var(--chip)}
.cu-bar .sp{flex:1}
.redbtn{height:48px;padding:0 20px;border-radius:24px;background:var(--red);color:#fff;font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px;transition:background .15s}
.redbtn:hover{background:var(--red-d)}
.greybtn{height:48px;padding:0 20px;border-radius:24px;background:var(--chip);font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px}
.greybtn:hover{background:var(--chip-h)}
.cu-link{font-size:14px;text-decoration:underline;color:#111;word-break:break-all}
.cu h1{font-size:28px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.01em}
.cu p.d{margin:0;font-size:15px;line-height:1.5;color:#333}
.brandrow{display:flex;align-items:center;gap:10px}
.brandrow .av{width:48px;height:48px;font-size:16px}
.brandrow b{display:block;font-size:15px}
.brandrow small{font-size:13px;color:var(--ink2)}
.brandrow .greybtn{margin-left:auto;height:44px;font-size:15px}
.promoted{font-size:13px;color:var(--ink2)}
.shopthis h3{font-size:16px;margin:4px 0 10px;font-weight:600}
.shopthis .row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prod{border-radius:14px;overflow:hidden;background:#f6f6f6;text-align:left;outline:2px solid transparent;outline-offset:-2px;transition:outline-color .25s,transform .25s}
.prod.on{outline-color:#111;transform:translateY(-2px)}
.prod .pi{aspect-ratio:1;background:#fff;display:grid;place-items:center}
.prod .pi img{width:84%;height:84%;object-fit:contain}
.prod .pi .sw{width:44%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.prod .pn{padding:8px 10px 10px;font-size:12.5px;font-weight:600;line-height:1.3}
.prod .pn small{display:block;font-weight:400;color:var(--ink2);margin-top:2px}
.nowshow{display:flex;align-items:center;gap:10px;background:#f6f6f6;border-radius:14px;padding:12px 14px;font-size:14px}
.nowshow .pulse{width:10px;height:10px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite;flex:none}
.nowshow b{font-weight:700}
.cmts{border-top:1px solid var(--line);padding-top:14px;font-size:14px;color:var(--ink2)}
.cmts b{color:#111}
.more-h{text-align:center;font-size:20px;font-weight:600;margin:30px 0 14px}

/* ---------- search ---------- */
.shead{display:flex;align-items:center;gap:8px;padding:0 8px 4px;flex-wrap:wrap}
.shead h2{margin:0 8px 0 0;font-size:20px;font-weight:600}
.empty-note{max-width:520px;margin:12px auto 20px;text-align:center;color:var(--ink2);font-size:14px}

/* ---------- visual search ---------- */
.lens{display:grid;grid-template-columns:minmax(240px,360px) minmax(0,1fr);gap:24px;max-width:1200px;margin:8px auto}
.lens>div{min-width:0}
.lens-img{position:sticky;top:calc(var(--top) + 8px);align-self:start;border-radius:24px;overflow:hidden;background:#111}
.lens-img img{width:100%;opacity:.95}
.crop{position:absolute;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);transition:all .5s var(--ease)}
.crop i{position:absolute;width:18px;height:18px;border-color:#fff;border-style:solid}
.lens-tabs{display:flex;gap:8px;margin:0 0 14px}
.lens h2{font-size:20px;margin:0 0 4px}
.lens p.sub{margin:0 0 14px;color:var(--ink2);font-size:14px}

/* ---------- quiz modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.scrim.on{display:flex;animation:fade .2s}
#modal-host{display:contents}
.modal{background:#fff;border-radius:28px;width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;position:relative;animation:up .3s var(--ease)}
.modal .x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9);z-index:5}
.modal .x:hover{background:var(--chip)}
.qhead{padding:22px 22px 8px}
.qhead small{font-size:12px;color:var(--ink2);font-weight:600}
.qhead h3{margin:6px 0 0;font-size:22px;line-height:1.25}
.qprog{display:flex;gap:6px;padding:0 22px}
.qprog i{flex:1;height:4px;border-radius:4px;background:#e6e6e6}
.qprog i.on{background:#111}
.qopts{display:grid;gap:10px;padding:16px 22px 22px}
.qopts button{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--chip);font-weight:600;font-size:15px;text-align:left;transition:background .15s,transform .15s}
.qopts button:hover{background:var(--chip-h);transform:translateX(2px)}
.qopts button em{font-style:normal;font-size:22px}
.qres .flick{border-radius:0}
.qres .body{padding:16px 22px 22px}
.qres h3{margin:0 0 6px;font-size:22px}
.qres p{margin:0 0 14px;color:#333;font-size:14.5px;line-height:1.5}
.qres .acts{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- leave sheet, toast, guide ---------- */
.sheet{background:#fff;border-radius:28px;width:min(420px,100%);padding:28px 24px 22px;text-align:center;animation:up .25s var(--ease)}
.sheet h3{margin:0 0 6px;font-size:22px}
.sheet p{margin:0 0 6px;color:var(--ink2);font-size:14px}
.sheet .u{font-size:12px;color:#767676;word-break:break-all;margin-bottom:18px}
.sheet .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#111;color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:95;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.gpill{position:fixed;right:20px;bottom:20px;z-index:70;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:#111;color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.gpill i{font-style:normal;background:var(--red);border-radius:999px;font-size:11px;padding:2px 8px}
.guide{position:fixed;right:20px;bottom:76px;width:min(380px,calc(100vw - 24px));max-height:min(72vh,640px);overflow:auto;background:#fff;border-radius:24px;box-shadow:0 12px 48px rgba(0,0,0,.25);padding:14px;z-index:70;display:none}
.guide.on{display:block;animation:up .25s var(--ease)}
.guide h4{margin:4px 8px 2px;font-size:16px}
.guide .gs{margin:0 8px 10px;font-size:12.5px;color:var(--ink2)}
.guide .gh{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#767676;margin:12px 8px 6px}
.guide button{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:10px;border-radius:14px}
.guide button:hover{background:var(--chip)}
.guide button .n{width:24px;height:24px;border-radius:50%;background:#111;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.guide button b{display:block;font-size:14px}
.guide button span{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.35}
.hl{animation:pulse 1.2s 2}
.hl .pm,.hl.coll,.hl .quiz{box-shadow:0 0 0 3px #111}

/* ---------- mobile nav ---------- */
.mnav{display:none}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .cu{grid-template-columns:1fr 1fr}
  .cu h1{font-size:24px}
}
@media (max-width:860px){
  .cu{grid-template-columns:1fr;border-radius:24px}
  .cu-side{padding:18px 16px 20px}
  .lens{grid-template-columns:1fr}
  .lens-img{position:relative;top:0;max-width:420px;width:100%;margin:0 auto}
}
@media (max-width:767px){
  :root{--rail:0px;--top:64px;--gap:8px}
  .rail{display:none}
  .top{left:0;padding:0 12px;height:var(--top)}
  .top .topbtn,.top .av{display:none}
  .sbox input{height:44px;border-radius:22px;font-size:15px}
  main{padding:var(--top) 8px calc(84px + env(safe-area-inset-bottom)) 8px}
  .chips{padding:4px 0 10px;top:var(--top)}
  .chip{height:36px;font-size:14px;padding:0 14px}
  .pcap{padding:6px 4px 2px}
  .pcap .t{font-size:13px}
  .pm .save,.openpin{display:none}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);z-index:60;justify-content:space-around;align-items:center}
  .mnav button{width:56px;height:48px;display:grid;place-items:center;color:#767676}
  .mnav button.on{color:#111}
  .back{left:10px;top:calc(var(--top) + 6px);width:40px;height:40px}
  .cu-wrap{margin-top:0}
  .cu{border-radius:0 0 24px 24px;box-shadow:none;margin:0 -8px}
  .cu-media{border-radius:0}
  .cu h1{font-size:22px}
  .redbtn,.greybtn{height:44px;font-size:15px;padding:0 16px}
  .gpill{right:12px;bottom:calc(76px + env(safe-area-inset-bottom));height:40px;padding:0 14px;font-size:13px}
  .guide{right:12px;bottom:calc(124px + env(safe-area-inset-bottom))}
  .more-h{font-size:17px;margin:22px 0 10px}
  .lens-img{border-radius:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<nav class="rail" aria-label="Main">
  <a class="logo" href="#home" aria-label="Home"><span>P</span></a>

function tagDoc(slotId, b){
  const bridge = `(function(){var S=${JSON.stringify(slotId)};function t(m){m.flam=1;m.slot=S;try{parent.postMessage(m,"*")}catch(e){}}
window.__vxOpen=function(u){t({type:"cta",url:u||""});return true};
window.ExitApi={exit:function(n,u){t({type:"cta",url:u||""})}};
window.open=function(u){t({type:"cta",url:String(u||"")});return null};
document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[target=_blank]");if(a){e.preventDefault();t({type:"cta",url:a.href})}},true);
function hook(v){if(v.__flam)return;v.__flam=1;
v.addEventListener("vertex-ready",function(){t({type:"ready"})});
v.addEventListener("vertex-error",function(e){var d=e.detail||{};if(d.recovered||d.severity==="warning")return;t({type:"error",msg:(d.message||d.code||"render error")+""})});
v.addEventListener("vertex-cta",function(e){var d=e.detail||{};t({type:"cta",url:d.url||""})});
v.addEventListener("vertex-diff-change",function(e){var d=e.detail||{};t({type:"switch",diff:+d.diff||0})});}
new MutationObserver(function(){var v=document.querySelector("vertex-player");if(v)hook(v)}).observe(document.documentElement,{childList:true,subtree:true});
window.addEventListener("error",function(e){var s=e.target;if(s&&s.tagName==="SCRIPT")t({type:"error",msg:"Could not load "+s.src})},true);})();`;
  const cfg = b.adConfig ? `<script>window.AD_CONFIG=window.AD_CONFIG||{};window.AD_CONFIG.dsp="dv360_studio";window.AD_CONFIG.publisherInfo={"publisher_id":"\${PUBLISHER_ID}","adsxt_publisher_id":"\${ADSXT_PUBLISHER_ID}","universal_site_id":"\${UNIVERSAL_SITE_ID}","source_url":"\${SOURCE_URL}","source_url_enc":"\${SOURCE_URL_ENC}","adsxt_ad_system_domain":"\${ADSXT_AD_SYSTEM_DOMAIN}"};window.AD_CONFIG.clickTracker={"mode":"exit","template":""};<\/script>` : "";
  const fonts = b.fontScan ? `<script>(function(){var seen={},head=document.head||document.documentElement,until=Date.now()+3e4;function add(css){if(seen[css])return;seen[css]=1;var s=document.createElement("style");s.textContent=css;head.appendChild(s)}function scan(){try{var ps=document.getElementsByTagName("vertex-player");for(var i=0;i<ps.length;i++){var r=ps[i].shadowRoot;if(!r)continue;var n=r.querySelectorAll("style,link[rel=stylesheet]");for(var j=0;j<n.length;j++){var el=n[j];if(el.tagName==="LINK"){if(/fonts\\.googleapis\\.com/.test(el.href)&&!seen[el.href]){seen[el.href]=1;var l=document.createElement("link");l.rel="stylesheet";l.href=el.href;head.appendChild(l)}continue}var m=(el.textContent||"").match(/@font-face\\s*\\{[^}]*\\}/g);if(m)add(m.join(""))}}}catch(e){}if(Date.now()<until)setTimeout(scan,250)}scan()})();<\/script>` : "";
  const bg = b.transparent ? "transparent" : (b.dark ? "#151515" : "#efefef");

<meta charset=utf-8>
<meta name=ad.orientation content=portrait,landscape>

let SLOTS = {}, slotSeq = 0;
function flick(id, brand, cls=""){
  SLOTS[id] = { brand, ready:false, error:false, lastCta:0, variant:0, timer:null, mounted:false };
  const b=BRANDS[brand];
  return `<div class="flick fl-${brand} ${b.dark?"dark":""} ${b.tall?"tall":""} ${cls}" data-slot="${id}"><div class="fstate"></div></div>`;
}
function variantOf(id){ const s=SLOTS[id], b=BRANDS[s.brand]; return b.variants[s.variant] || b.variants[0]; }
function shop(id){ const s=SLOTS[id]; if(!s) return; openSheet(s.brand, variantOf(id).url || BRANDS[s.brand].url); }
function syncVariant(id){
  const s=SLOTS[id]; if(!s) return;
  document.querySelectorAll(`[data-vname="${id}"]`).forEach(el=>{ el.style.opacity=0; setTimeout(()=>{ el.textContent = variantOf(id).n; el.style.opacity=1; },150); });
  document.querySelectorAll(`[data-sync="${id}"]`).forEach(el=>el.classList.toggle("on", +el.dataset.i===s.variant));
}
let io=null;
function observeFlicks(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es=>es.forEach(en=>{ en.isIntersecting ? mount(en.target) : unmount(en.target); }), { rootMargin:"700px 0px 700px 0px" });
  document.querySelectorAll(".view.on .flick[data-slot], #modal-host .flick[data-slot]").forEach(h=>io.observe(h));
}
function mount(host){
  const id=host.dataset.slot, s=SLOTS[id]; if(!s || s.mounted) return;
  s.mounted=true; s.ready=false; s.error=false;
  const f=document.createElement("iframe");
  f.title=`${BRANDS[s.brand].name} Flick: interactive video`; f.setAttribute("allow","autoplay; fullscreen"); f.setAttribute("scrolling","no");
  f.srcdoc=tagDoc(id, BRANDS[s.brand]);
  host.prepend(f);
  s.timer=setTimeout(()=>{
    if(s.ready||s.error||!s.mounted) return;
    host.classList.add("rdy"); host.querySelector(".fstate")?.classList.add("hide");
    if(!host.querySelector(".fwarn")) host.insertAdjacentHTML("beforeend",`<span class="fwarn">No ready signal from Flick yet</span>`);
    console.warn("[flicks] no vertex-ready from", id, BRANDS[s.brand].src);
  },10000);
}
function unmount(host){
  const id=host.dataset.slot, s=SLOTS[id]; if(!s || !s.mounted || s.error) return;
  clearTimeout(s.timer); s.mounted=false; s.ready=false; s.variant=0;
  host.classList.remove("rdy"); host.querySelector("iframe")?.remove(); host.querySelector(".fwarn")?.remove();
  const st=host.querySelector(".fstate"); if(st) st.className="fstate";
  syncVariant(id);
}
function dropSlots(root){ root.querySelectorAll(".flick[data-slot]").forEach(h=>{ const id=h.dataset.slot; if(SLOTS[id]){ clearTimeout(SLOTS[id].timer); delete SLOTS[id]; } }); }
window.addEventListener("message", e=>{
  const m=e.data; if(!m || m.flam!==1) return;
  const s=SLOTS[m.slot]; if(!s) return;
  const host=document.querySelector(`.flick[data-slot="${m.slot}"]`);
  if(!host || e.source!==host.querySelector("iframe")?.contentWindow) return;
  if(m.type==="ready"){ s.ready=true; clearTimeout(s.timer); host.classList.add("rdy"); host.querySelector(".fstate")?.classList.add("hide"); host.querySelector(".fwarn")?.remove(); }
  else if(m.type==="error"){
    s.error=true; clearTimeout(s.timer); console.error("[flicks] render error", m.slot, m.msg);
    const st=host.querySelector(".fstate"); st.className="fstate err";
    st.innerHTML=`<div><b>Flick failed to load</b>${esc(m.msg)}<br><br>If this file is open inside a preview window, open it directly in Chrome. Previews block ad scripts.</div>`;
  }
  else if(m.type==="switch"){ const v=Math.max(0,Math.min(m.diff, BRANDS[s.brand].variants.length-1)); if(v!==s.variant){ s.variant=v; syncVariant(m.slot); } }
  else if(m.type==="cta"){ const now=Date.now(); if(now-s.lastCta<900) return; s.lastCta=now; openSheet(s.brand, m.url || variantOf(m.slot).url || BRANDS[s.brand].url); }
});

/* ================= masonry (absolute, so Flick iframes never reload on resize) ================= */
const GRIDS = {};
function colInfo(el){
  const W = el.parentElement.clientWidth;
  const mobile = innerWidth < 768;
  const gap = mobile ? 8 : 16;
  const min = mobile ? 150 : (W < 700 ? 200 : 236);
  let n = Math.max(2, Math.floor((W+gap)/(min+gap)));
  if(!mobile) n = Math.min(n, 7);
  const cw = Math.floor((W - gap*(n-1))/n);
  return {n, cw, gap, W: cw*n + gap*(n-1)};
}
function renderGrid(el, items, ctx){
  dropSlots(el);
  const cards = items.map(it => typeof it==="string" ? organicCard(it) : flickCard(it, ctx));
  el.innerHTML = cards.map((c,i)=>`<div class="pin ${c.flk?"flk":""}" data-span="${c.span}" style="animation-delay:${Math.min(i,14)*30}ms">${c.html}</div>`).join("");
  GRIDS[el.id] = true;
  layout(el);
  // images change height as they load only if aspect is unknown; aspect-ratio is set, so one pass + a late pass is enough
  requestAnimationFrame(()=>layout(el)); setTimeout(()=>layout(el), 300); setTimeout(()=>layout(el), 1200);
}
function layout(el){
  if(!el || !el.children.length) return;
  const {n, cw, gap, W} = colInfo(el);
  el.style.width = W+"px";
  const H = new Array(n).fill(0);
  [...el.children].forEach(p=>{
    const span = p.dataset.span==="all" ? (innerWidth<768 ? n : Math.min(2,n)) : 1;
    p.style.width = (cw*span + gap*(span-1)) + "px";
    let col=0, best=Infinity;
    for(let c=0;c<=n-span;c++){ const top=Math.max(...H.slice(c,c+span)); if(top<best-1){best=top;col=c;} }
    p.style.transform = `translate(${col*(cw+gap)}px, ${best}px)`;
    const h = p.offsetHeight;
    for(let c=col;c<col+span;c++) H[c] = best + h + (innerWidth<768?14:20);
  });
  el.style.height = Math.max(...H) + "px";
}
let rT; addEventListener("resize", ()=>{ clearTimeout(rT); rT=setTimeout(()=>document.querySelectorAll(".view.on .grid").forEach(layout), 120); });

        <button class="ico" aria-label="More" onclick="toast('Pin options are not part of this demo')"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
        <span class="sp"></span><button class="redbtn" onclick="toast('Saved to your board')">Save</button></div>
      <h1>${esc(title)}</h1>
      <div class="brandrow"><span class="av" style="background:#eee;color:#555">${creatorFor(key)[0]}</span><div><b>${esc(creatorFor(key))}</b><small>Photo via Unsplash</small></div><button class="greybtn" onclick="toast('Following')">Follow</button></div>
      <div class="cmts"><b>Comments</b><br>No comments yet. Add one to start the conversation.</div>`;
    related = relatedOrganic(cat);
    ctx = "rel-"+cat;
  }
  host.innerHTML = `<button class="back" onclick="history.length>1?history.back():go('#home')" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="cu-wrap"><div class="cu"><div class="cu-media">${media}</div><div class="cu-side">${side}</div></div></div>
    <div class="more-h">More to explore</div><div class="grid" id="g-pin"></div>`;
  renderGrid(document.getElementById("g-pin"), related, ctx);
  observeFlicks();
}

function relatedOrganic(cat){
  const pool = Object.keys(P).filter(k=>P[k][4]===cat).slice(0,10);
  const ad = {fashion:{f:"gap",fmt:"std"},food:{f:"bj",fmt:"std"},gifts:{f:"sony",fmt:"shop"},autos:{f:"merc",fmt:"std"},pets:{f:"bark",fmt:"std"},travel:{f:"pata",fmt:"std"}}[cat];
  if(ad) pool.splice(2,0,ad);
  return pool;
}

/* visual search ad */

  const host=document.getElementById("v-lens");
  dropSlots(host); scrollTo(0,0);

  <div class="lens">

    <div>
      <h2>Visually similar</h2>

/* ================= quiz ad ================= */
const QUIZ = [
  {q:"How do you drive most days?", o:[["🏙️","Around the city"],["🛣️","Long open roads"],["👨‍👩‍👧","Family hauls"]]},
  {q:"What matters most?", o:[["🔋","All-electric range"],["✨","A one-of-a-kind car"],["💪","Space and power"]]}
];
let qa=[];
function openQuiz(){ qa=[]; renderQuiz(); document.getElementById("scrim").classList.add("on"); }
function renderQuiz(){
  const mh=document.getElementById("modal-host"); dropSlots(mh);
  const close = `<button class="x" onclick="closeModal()" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;
  if(qa.length < QUIZ.length){
    const Q=QUIZ[qa.length];
    mh.innerHTML = `<div class="modal" role="dialog" aria-label="Cadillac quiz">${close}<div class="qhead"><small>Quiz · Cadillac · Question ${qa.length+1} of ${QUIZ.length}</small><h3>${Q.q}</h3></div>
      <div class="qprog" style="margin-top:12px">${QUIZ.map((_,i)=>`<i class="${i<=qa.length?"on":""}"></i>`).join("")}</div>
      <div class="qopts">${Q.o.map((o,i)=>`<button onclick="qa.push(${i});renderQuiz()"><em>${o[0]}</em>${o[1]}</button>`).join("")}</div></div>`;
    return;
  }
  const pick = qa[1]===0 ? 0 : qa[1]===1 ? 1 : 2;
  const names=["Optiq","Celestiq","Escalade-V"], why=["compact, all-electric and easy to live with every day","hand-built and made to order, the rarest Cadillac","full-size room with performance to match"];
  const id=`quiz-cad-${slotSeq++}`;
  mh.innerHTML = `<div class="modal qres" role="dialog" aria-label="Your Cadillac match">${close}${flick(id,"cad")}
    <div class="body"><h3>Your match: ${names[pick]}</h3>
    <p>${why[pick]}. Tap the cars in the video to compare all three on the same drive. Now showing <b data-vname="${id}">Optiq</b>.</p>
    <div class="acts"><button class="redbtn" onclick="shop('${id}')">Explore your Cadillac ${OPEN_IC}</button><button class="greybtn" onclick="qa=[];renderQuiz()">Retake</button></div></div></div>`;
  observeFlicks();
}
function closeModal(){ const mh=document.getElementById("modal-host"); mh.querySelectorAll(".flick[data-slot]").forEach(unmount); dropSlots(mh); mh.innerHTML=""; document.getElementById("scrim").classList.remove("on"); }

/* ================= leave sheet ================= */
function openSheet(brand, url){
  const b=BRANDS[brand]; url = url || b.url;
  const mh=document.getElementById("modal-host"); mh.querySelectorAll(".flick[data-slot]").forEach(unmount); dropSlots(mh);
  mh.innerHTML = `<div class="sheet" role="dialog" aria-label="Leaving Pinterest"><h3>Visit ${esc(b.name)}</h3><p>You're leaving Pinterest to visit the advertiser's site.</p><div class="u">${esc(url)}</div>
    <div class="acts"><button class="greybtn" onclick="closeModal()">Stay</button><a class="redbtn" href="${esc(url)}" target="_blank" rel="noopener" onclick="closeModal()">Continue to ${esc(b.domain)}</a></div></div>`;
  document.getElementById("scrim").classList.add("on");
}
addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeModal(); toggleGuide(false); hideSugg(); } });

/* ================= search box ================= */
const qEl=document.getElementById("q"), sg=document.getElementById("sugg");
let hi=-1;
function renderSugg(){
  const v=qEl.value.trim().toLowerCase();
  const list = v ? SUGG.filter(s=>s.includes(v) || v.split(/\s+/).some(w=>w.length>2 && s.includes(w))) : SUGG;
  const show = (list.length?list:SUGG).slice(0,8);
  sg.innerHTML = `<h6>${v?"Suggestions":"Popular on Pinterest"}</h6>` + show.map((s,i)=>`<button class="${i===hi?"hi":""}" onmousedown="event.preventDefault();go('#search/${encodeURIComponent(s)}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg>${esc(s)}${SEARCHES[s].items.some(x=>typeof x!=="string")?"<i>Flick</i>":""}</button>`).join("");
  sg.dataset.list = JSON.stringify(show);
}
function openSugg(){ qEl.focus(); }
function hideSugg(){ sg.classList.remove("on"); qEl.blur(); }
qEl.addEventListener("focus", ()=>{ hi=-1; renderSugg(); sg.classList.add("on"); });
qEl.addEventListener("blur", ()=>setTimeout(()=>sg.classList.remove("on"),120));
qEl.addEventListener("input", ()=>{ hi=-1; renderSugg(); });
qEl.addEventListener("keydown", e=>{
  const list=JSON.parse(sg.dataset.list||"[]");
  if(e.key==="ArrowDown"){ hi=Math.min(hi+1,list.length-1); renderSugg(); e.preventDefault(); }
  else if(e.key==="ArrowUp"){ hi=Math.max(hi-1,-1); renderSugg(); e.preventDefault(); }
  else if(e.key==="Enter"){ const t = hi>=0 ? list[hi] : (qEl.value.trim()||list[0]); hideSugg(); go('#search/'+encodeURIComponent(t)); }
});

/* ================= ad formats guide ================= */
const FORMATS = [
  {h:"Home feed"},
  {t:"Standard Pin", s:"Levi's Flick in the home feed. Tap a look to switch it.", go:"#home", a:"home:levis:std"},
  {t:"Max-width video", s:"Nike Flick across the full feed width.", go:"#home", a:"home:nike:max"},
  {t:"Idea ad (9:16)", s:"Acer Flick, full-height. Switch laptops in the video.", go:"#home", a:"home:acer:idea"},
  {t:"Quiz ad", s:"Cadillac quiz that ends on a Flick of your match.", go:"#home", a:"home:cad:quiz"},
  {h:"Search"},
  {t:"Top of Search: Fashion", s:"\"fall outfits women\" opens on the Gap Flick.", go:"#search/fall%20outfits%20women", a:"s-fashion:gap:tos"},
  {t:"Collection ad: Food", s:"\"easy breakfast ideas\": General Mills Flick with three cereals synced below.", go:"#search/easy%20breakfast%20ideas", a:"s-food:gm:coll"},
  {t:"Shopping ads: Holiday gifts", s:"\"gifts for him\": Sony, Bose (Best Buy) and Cross Flicks with an Acer Idea ad.", go:"#search/gifts%20for%20him", a:"s-gifts:sony:tos"},
  {t:"Top of Search: Autos", s:"\"luxury SUV\": Bentley, then Cadillac and Mercedes-Benz.", go:"#search/luxury%20SUV", a:"s-autos:bentley:tos"},
  {t:"Top of Search: Snacks, Pets, Outdoor", s:"Doritos on \"game day snacks\", BARK on \"dog toys\", Patagonia on \"hiking outfits\".", go:"#search/game%20day%20snacks", a:"s-food:dor:tos"},
  {h:"Close-up and visual search"},
  {t:"Pin close-up", s:"Gap Flick full size; the products below follow each switch.", go:"#pin/f-gap"},
  {t:"Visual search ad", s:"Search a car photo; the Mercedes-Benz Flick leads the similar results.", go:"#lens", a:"lens:merc:vsa"}
];
document.getElementById("gcount").textContent = FORMATS.filter(f=>f.t).length;
document.getElementById("guide").innerHTML = `<h4>Flicks on Pinterest</h4><p class="gs">Jump to each placement. Every Flick here is a live tag.</p>` +
  (()=>{ let n=0; return FORMATS.map((f,i)=> f.h ? `<div class="gh">${f.h}</div>` : `<button onclick="jump(${i})"><span class="n">${++n}</span><span><b>${f.t}</b><span>${f.s}</span></span></button>`).join(""); })();
function toggleGuide(on){ const g=document.getElementById("guide"); on = on===undefined ? !g.classList.contains("on") : on; g.classList.toggle("on", on); document.getElementById("gpill").setAttribute("aria-expanded", on); }
let pendingAnchor=null;
function jump(i){ const f=FORMATS[i]; toggleGuide(false); pendingAnchor=f.a||null; if(location.hash===f.go) focusAnchor(); else location.hash=f.go; }
function focusAnchor(){
  if(!pendingAnchor) return;
  const a=pendingAnchor; pendingAnchor=null;
  setTimeout(()=>{
    const el=document.querySelector(`.view.on [data-anchor="${a}"]`); if(!el) return;
    const pin=el.closest(".pin")||el;
    const r=pin.getBoundingClientRect();
    scrollTo({top: scrollY + r.top - (innerWidth<768?120:150), behavior:"smooth"});
    pin.classList.remove("hl"); void pin.offsetWidth; pin.classList.add("hl");
  }, 380);
}

/* ================= router ================= */
function go(h){ if(location.hash===h) route(); else location.hash=h; }
function route(){
  const h=decodeURIComponent(location.hash||"#home");
  closeModal(); hideSugg();
  if(h.startsWith("#search/")) viewSearch(h.slice(8));
  else if(h.startsWith("#pin/")) viewPin(h.slice(5));
  else if(h==="#lens") viewLens();
  else { viewHome(); }
  focusAnchor();
}
addEventListener("hashchange", route);
route();
</script>
